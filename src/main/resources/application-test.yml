message:
  basenames: string/string

spring:
  sql:
    init:
      mode: always
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: true
  datasource:
    # DB Config
#    driver-class-name: oracle.jdbc.OracleDriver
    driver-class-name: org.h2.Driver
#    url: ${APP_DB_URL}
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 9000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 0
  # JPA
  jpa:
    hibernate:
      ddl-auto: create
#       ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
chzzk:
  check-interval: 120
  api-url: ${CHZZK_API_URL:null}
  oauth:
    auth-base-url: https://chzzk.naver.com
    token-base-url: http://localhost:65535
    api-base-url: http://localhost:65535
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: https://example.test/callback

app:
  default-timezone: "Asia/Seoul"
  insert-password: "test1234"
  is-test: true
  auth:
    jwt:
      secret: "test-jwt-secret-change-me-32-bytes-minimum"
      issuer: "chzzk-event-to-discord-test"
      access-token-ttl: "PT1H"
      refresh-token-ttl: "P30D"
      oauth-state-ttl: "PT5M"
      cookie-secure: false
      cookie-same-site: "Lax"

storage:
  s3:
    availability-check-enabled: false

youtube:
  check-interval: 120
  api-base-url: http://localhost:65535
  api-key: test-youtube-api-key
