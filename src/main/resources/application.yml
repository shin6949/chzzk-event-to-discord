message:
  basenames: string/string

spring:
  main:
    allow-bean-definition-overriding: true

  flyway:
    locations: classpath:db/migration/{vendor}

  datasource:
    # DB Config
#    driver-class-name: org.postgresql.Driver
    driver-class-name: ${APP_DB_DRIVER}
    url: ${APP_DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

    # hikari
    hikari:
      maximum-pool-size: ${APP_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${APP_DB_MIN_IDLE:2}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:9000}
      idle-timeout: ${APP_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${APP_DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${APP_DB_KEEPALIVE_TIME_MS:0}

  # JPA
  jpa:
    hibernate:
#      ddl-auto: create
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: true

chzzk:
  check-interval: ${CHZZK_CHECK_INTERVAL:30}
  api-url: ${CHZZK_API_URL:null}
  oauth:
    auth-base-url: ${CHZZK_OAUTH_AUTH_BASE_URL:https://chzzk.naver.com}
    token-base-url: ${CHZZK_OAUTH_TOKEN_BASE_URL:https://openapi.chzzk.naver.com}
    api-base-url: ${CHZZK_OAUTH_API_BASE_URL:https://openapi.chzzk.naver.com}
    client-id: ${CHZZK_OAUTH_CLIENT_ID:}
    client-secret: ${CHZZK_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${CHZZK_OAUTH_REDIRECT_URI:}

app:
  default-timezone: ${APP_DEFAULT_TIMEZONE:Asia/Seoul}
  insert-password: ${APP_INSERT_PASSWORD:null}
  is-test: ${APP_IS_TEST:false}
  auth:
    jwt:
      secret: ${APP_AUTH_JWT_SECRET:local-development-jwt-secret-change-me-32-bytes-minimum}
      issuer: ${APP_AUTH_JWT_ISSUER:chzzk-event-to-discord}
      access-token-ttl: ${APP_AUTH_JWT_ACCESS_TOKEN_TTL:PT1H}
      refresh-token-ttl: ${APP_AUTH_JWT_REFRESH_TOKEN_TTL:P30D}
      oauth-state-ttl: ${APP_AUTH_OAUTH_STATE_TTL:PT5M}
      access-cookie-name: ${APP_AUTH_ACCESS_COOKIE_NAME:chzzk_app_access}
      refresh-cookie-name: ${APP_AUTH_REFRESH_COOKIE_NAME:chzzk_app_refresh}
      oauth-state-cookie-name: ${APP_AUTH_OAUTH_STATE_COOKIE_NAME:chzzk_oauth_state}
      cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
      cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
  static-content:
    url-prefix: ${APP_STATIC_CONTENT_URL_PREFIX:}

storage:
  s3:
    endpoint: ${APP_STORAGE_S3_ENDPOINT:${STORAGE_S3_ENDPOINT:http://localhost:9000}}
    region: ${APP_STORAGE_S3_REGION:${STORAGE_S3_REGION:ap-northeast-2}}
    bucket: ${APP_STORAGE_S3_BUCKET:${STORAGE_S3_BUCKET:chzzk-event-assets}}
    access-key: ${APP_STORAGE_S3_ACCESS_KEY:${STORAGE_S3_ACCESS_KEY:minioadmin}}
    secret-key: ${APP_STORAGE_S3_SECRET_KEY:${STORAGE_S3_SECRET_KEY:minioadmin}}
    force-path-style: ${APP_STORAGE_S3_FORCE_PATH_STYLE:${STORAGE_S3_FORCE_PATH_STYLE:true}}
    disable-chunked-encoding: ${APP_STORAGE_S3_DISABLE_CHUNKED_ENCODING:${STORAGE_S3_DISABLE_CHUNKED_ENCODING:true}}
    prefix: ${APP_STORAGE_S3_PREFIX:${STORAGE_S3_PREFIX:bot-profiles}}
    connection-timeout-millis: ${APP_STORAGE_S3_CONNECTION_TIMEOUT_MS:${STORAGE_S3_CONNECTION_TIMEOUT_MS:5000}}
    socket-timeout-millis: ${APP_STORAGE_S3_SOCKET_TIMEOUT_MS:${STORAGE_S3_SOCKET_TIMEOUT_MS:60000}}
    api-call-attempt-timeout-millis: ${APP_STORAGE_S3_API_CALL_ATTEMPT_TIMEOUT_MS:${STORAGE_S3_API_CALL_ATTEMPT_TIMEOUT_MS:120000}}
    api-call-timeout-millis: ${APP_STORAGE_S3_API_CALL_TIMEOUT_MS:${STORAGE_S3_API_CALL_TIMEOUT_MS:120000}}
    availability-check-enabled: ${APP_STORAGE_S3_AVAILABILITY_CHECK_ENABLED:${STORAGE_S3_AVAILABILITY_CHECK_ENABLED:true}}
    required-on-startup: ${APP_STORAGE_S3_REQUIRED_ON_STARTUP:${STORAGE_S3_REQUIRED_ON_STARTUP:false}}
    availability-check-interval-millis: ${APP_STORAGE_S3_AVAILABILITY_CHECK_INTERVAL_MS:${STORAGE_S3_AVAILABILITY_CHECK_INTERVAL_MS:60000}}
    availability-check-timeout-millis: ${APP_STORAGE_S3_AVAILABILITY_CHECK_TIMEOUT_MS:${STORAGE_S3_AVAILABILITY_CHECK_TIMEOUT_MS:5000}}
  upload:
    max-bytes: ${APP_STORAGE_UPLOAD_MAX_BYTES:${STORAGE_UPLOAD_MAX_BYTES:5242880}}
    allowed-types: ${APP_STORAGE_UPLOAD_ALLOWED_TYPES:${STORAGE_UPLOAD_ALLOWED_TYPES:image/png,image/jpeg,image/webp}}
