x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${APP_DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${APP_DOCKER_LOG_MAX_FILE:-5}"

services:
  # Docker Compose reads .env from this directory for ${...} interpolation.
  # Start from .env.example and keep the real .env out of git.
  postgres:
    image: postgres:17.4-alpine
    container_name: streaming-alert-service-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-streaming_alert_service}
      POSTGRES_USER: ${APP_DB_USER:-streaming_alert}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      TZ: ${APP_DEFAULT_TIMEZONE:-Asia/Seoul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: streaming-alert-service-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      TZ: ${APP_DEFAULT_TIMEZONE:-Asia/Seoul}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: streaming-alert-service-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-${STORAGE_S3_BUCKET:-streaming-alert-service-assets}}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing local/\"$${APP_STORAGE_S3_BUCKET}\";
      mc anonymous set download local/\"$${APP_STORAGE_S3_BUCKET}\"/bot-profiles;
      "
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: streaming-alert-service-backend:latest
    container_name: streaming-alert-service-backend
    expose:
      - "8080"
    environment:
      APP_DB_DRIVER: ${APP_DB_DRIVER:-org.postgresql.Driver}
      APP_DB_URL: ${APP_DB_URL:-jdbc:postgresql://postgres:5432/${APP_DB_NAME:-streaming_alert_service}}
      APP_DB_USER: ${APP_DB_USER:-streaming_alert}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      APP_DB_MAX_POOL_SIZE: ${APP_DB_MAX_POOL_SIZE:-10}
      APP_DB_MIN_IDLE: ${APP_DB_MIN_IDLE:-2}
      APP_DB_CONNECTION_TIMEOUT_MS: ${APP_DB_CONNECTION_TIMEOUT_MS:-9000}
      APP_DB_IDLE_TIMEOUT_MS: ${APP_DB_IDLE_TIMEOUT_MS:-600000}
      APP_DB_MAX_LIFETIME_MS: ${APP_DB_MAX_LIFETIME_MS:-1800000}
      APP_DB_KEEPALIVE_TIME_MS: ${APP_DB_KEEPALIVE_TIME_MS:-0}
      CHZZK_OAUTH_CLIENT_ID: ${CHZZK_OAUTH_CLIENT_ID}
      CHZZK_OAUTH_CLIENT_SECRET: ${CHZZK_OAUTH_CLIENT_SECRET}
      CHZZK_OAUTH_REDIRECT_URI: ${CHZZK_OAUTH_REDIRECT_URI}
      CHZZK_OAUTH_AUTH_BASE_URL: ${CHZZK_OAUTH_AUTH_BASE_URL:-https://chzzk.naver.com}
      CHZZK_OAUTH_TOKEN_BASE_URL: ${CHZZK_OAUTH_TOKEN_BASE_URL:-https://openapi.chzzk.naver.com}
      CHZZK_OAUTH_API_BASE_URL: ${CHZZK_OAUTH_API_BASE_URL:-https://openapi.chzzk.naver.com}
      CHZZK_CHECK_INTERVAL: ${CHZZK_CHECK_INTERVAL:-30}
      CHZZK_API_URL: ${CHZZK_API_URL:-https://api.chzzk.naver.com}
      APP_INSERT_PASSWORD: ${APP_INSERT_PASSWORD:-}
      APP_DEFAULT_TIMEZONE: ${APP_DEFAULT_TIMEZONE:-Asia/Seoul}
      APP_IS_TEST: ${APP_IS_TEST:-false}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:?Set APP_AUTH_JWT_SECRET}
      APP_AUTH_JWT_ISSUER: ${APP_AUTH_JWT_ISSUER:-streaming-alert-service}
      APP_AUTH_JWT_ACCESS_TOKEN_TTL: ${APP_AUTH_JWT_ACCESS_TOKEN_TTL:-PT1H}
      APP_AUTH_JWT_REFRESH_TOKEN_TTL: ${APP_AUTH_JWT_REFRESH_TOKEN_TTL:-P30D}
      APP_AUTH_OAUTH_STATE_TTL: ${APP_AUTH_OAUTH_STATE_TTL:-PT5M}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      APP_AUTH_COOKIE_SAME_SITE: ${APP_AUTH_COOKIE_SAME_SITE:-Lax}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:?Set APP_SECRET_ENCRYPTION_KEY}
      APP_LEGACY_FORM_INSERT_ENABLED: ${APP_LEGACY_FORM_INSERT_ENABLED:-false}
      APP_DISCORD_WEBHOOK_ALLOWED_HOSTS: ${APP_DISCORD_WEBHOOK_ALLOWED_HOSTS:-discord.com,discordapp.com}
      APP_SECURITY_MAX_PAGE_SIZE: ${APP_SECURITY_MAX_PAGE_SIZE:-100}
      APP_STATIC_CONTENT_URL_PREFIX: ${APP_STATIC_CONTENT_URL_PREFIX:-http://localhost:9000/streaming-alert-service-assets}
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-${STORAGE_S3_ENDPOINT:-http://minio:9000}}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-${STORAGE_S3_BUCKET:-streaming-alert-service-assets}}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-${STORAGE_S3_REGION:-ap-northeast-2}}
      APP_STORAGE_S3_ACCESS_KEY: ${APP_STORAGE_S3_ACCESS_KEY:-${STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}}}
      APP_STORAGE_S3_SECRET_KEY: ${APP_STORAGE_S3_SECRET_KEY:-${STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}}}
      APP_STORAGE_S3_FORCE_PATH_STYLE: ${APP_STORAGE_S3_FORCE_PATH_STYLE:-${STORAGE_S3_FORCE_PATH_STYLE:-true}}
      APP_STORAGE_S3_DISABLE_CHUNKED_ENCODING: ${APP_STORAGE_S3_DISABLE_CHUNKED_ENCODING:-${STORAGE_S3_DISABLE_CHUNKED_ENCODING:-true}}
      APP_STORAGE_S3_PREFIX: ${APP_STORAGE_S3_PREFIX:-${STORAGE_S3_PREFIX:-bot-profiles}}
      APP_STORAGE_S3_CONNECTION_TIMEOUT_MS: ${APP_STORAGE_S3_CONNECTION_TIMEOUT_MS:-${STORAGE_S3_CONNECTION_TIMEOUT_MS:-5000}}
      APP_STORAGE_S3_SOCKET_TIMEOUT_MS: ${APP_STORAGE_S3_SOCKET_TIMEOUT_MS:-${STORAGE_S3_SOCKET_TIMEOUT_MS:-60000}}
      APP_STORAGE_S3_API_CALL_ATTEMPT_TIMEOUT_MS: ${APP_STORAGE_S3_API_CALL_ATTEMPT_TIMEOUT_MS:-${STORAGE_S3_API_CALL_ATTEMPT_TIMEOUT_MS:-120000}}
      APP_STORAGE_S3_API_CALL_TIMEOUT_MS: ${APP_STORAGE_S3_API_CALL_TIMEOUT_MS:-${STORAGE_S3_API_CALL_TIMEOUT_MS:-120000}}
      APP_STORAGE_S3_AVAILABILITY_CHECK_ENABLED: ${APP_STORAGE_S3_AVAILABILITY_CHECK_ENABLED:-${STORAGE_S3_AVAILABILITY_CHECK_ENABLED:-true}}
      APP_STORAGE_S3_REQUIRED_ON_STARTUP: ${APP_STORAGE_S3_REQUIRED_ON_STARTUP:-${STORAGE_S3_REQUIRED_ON_STARTUP:-false}}
      APP_STORAGE_S3_AVAILABILITY_CHECK_INTERVAL_MS: ${APP_STORAGE_S3_AVAILABILITY_CHECK_INTERVAL_MS:-${STORAGE_S3_AVAILABILITY_CHECK_INTERVAL_MS:-60000}}
      APP_STORAGE_S3_AVAILABILITY_CHECK_TIMEOUT_MS: ${APP_STORAGE_S3_AVAILABILITY_CHECK_TIMEOUT_MS:-${STORAGE_S3_AVAILABILITY_CHECK_TIMEOUT_MS:-5000}}
      APP_STORAGE_UPLOAD_MAX_BYTES: ${APP_STORAGE_UPLOAD_MAX_BYTES:-${STORAGE_UPLOAD_MAX_BYTES:-5242880}}
      APP_STORAGE_UPLOAD_ALLOWED_TYPES: ${APP_STORAGE_UPLOAD_ALLOWED_TYPES:-${STORAGE_UPLOAD_ALLOWED_TYPES:-image/png,image/jpeg,image/webp}}
      APP_STORAGE_UPLOAD_MAX_WIDTH: ${APP_STORAGE_UPLOAD_MAX_WIDTH:-${STORAGE_UPLOAD_MAX_WIDTH:-4096}}
      APP_STORAGE_UPLOAD_MAX_HEIGHT: ${APP_STORAGE_UPLOAD_MAX_HEIGHT:-${STORAGE_UPLOAD_MAX_HEIGHT:-4096}}
      APP_STORAGE_UPLOAD_MAX_PIXELS: ${APP_STORAGE_UPLOAD_MAX_PIXELS:-${STORAGE_UPLOAD_MAX_PIXELS:-16777216}}
    depends_on:
      postgres:
        condition: service_healthy
#      minio-bootstrap:
#        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: streaming-alert-service-frontend:latest
    container_name: streaming-alert-service-frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
